[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
s4s-core = { path = "crates/core" }
s4s-server = { path = "crates/server" }

gst = { package = "gstreamer", version = "0.25" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
